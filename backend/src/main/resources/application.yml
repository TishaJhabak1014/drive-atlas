server:
  port: 8080
  forward-headers-strategy: ${FORWARDED_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: driveatlas-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/driveatlas}
    username: ${DATABASE_USERNAME:driveatlas}
    password: ${DATABASE_PASSWORD:driveatlas}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
